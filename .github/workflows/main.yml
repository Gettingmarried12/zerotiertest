      - name: Join ZeroTier Network
        run: |
          # Wait for ZeroTier service to start
          Start-Sleep -Seconds 10
          
          # Join the ZeroTier network (08752e18b1b9d956)
          $networkId = "${{ secrets.ZEROTIER_NETWORK_ID }}"
          & "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat" join $networkId
          
          # Wait for ZeroTier IP to be assigned
          Write-Host "Waiting for ZeroTier IP..."
          $ztIP = $null
          $retries = 0
          
          # Retry the IP check until we get a valid ZeroTier IP
          while (-not $ztIP -and $retries -lt 10) {
              # Retrieve the ZeroTier network info
              $info = & "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat" listnetworks
              
              # Extract the IP address from the output
              if ($info) {
                  $ztIP = ($info | Select-String -Pattern "OK" | ForEach-Object { $_.Line.Trim() }).Split(' ')[1]
              }

              if ($ztIP) {
                  Write-Host "ZeroTier IP: $ztIP"
              }
              else {
                  Write-Host "Waiting for IP assignment..."
              }
              
              Start-Sleep -Seconds 5
              $retries++
          }
          
          # If we still don't have an IP after retries, error out
          if (-not $ztIP) {
              Write-Error "ZeroTier IP not assigned after multiple retries."
              exit 1
          }

          echo "ZEROTIER_IP=$ztIP" >> $env:GITHUB_ENV
